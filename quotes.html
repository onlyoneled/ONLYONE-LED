<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ONLYONE LED — 견적서</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Gothic+A1:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --ink: #f6f4ef; --bg: #0a0a0a; --panel: #141414; --panel-2: #1c1c1c;
  --line: rgba(246,244,239,.14); --line-strong: rgba(246,244,239,.28);
  --mute: rgba(246,244,239,.55); --accent: oklch(0.92 0.22 130);
  --danger: oklch(0.7 0.2 28);
  --display: "Archivo Black", sans-serif;
  --body: "Gothic A1", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--body);
  -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; background: none; border: none; }
a { color: inherit; text-decoration: none; }

/* ── LOGIN ── */
#login-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.login-box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 40px 36px; width: min(380px, 92vw); display: flex; flex-direction: column; gap: 20px;
}
.login-box h1 { font-family: var(--display); font-size: 22px; }
.login-box p  { font-size: 13px; color: var(--mute); }
.login-box input[type=password] {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 16px; font-size: 15px; width: 100%; outline: none; transition: border-color .15s;
}
.login-box input[type=password]:focus { border-color: var(--accent); }
.btn-login {
  background: var(--accent); color: #0a0a0a; font-weight: 700;
  border-radius: 10px; padding: 12px; font-size: 15px; cursor: pointer; transition: opacity .15s;
}
.btn-login:hover { opacity: .85; }
.login-err { color: var(--danger); font-size: 13px; min-height: 18px; }

/* ── APP SHELL ── */
#app { display: none; flex-direction: column; min-height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 24px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 40;
}
.topbar-logo { font-family: var(--display); font-size: 16px; letter-spacing: -.02em; }
.topbar-back {
  display: none; align-items: center; gap: 6px; font-size: 14px; color: var(--mute);
  cursor: pointer; transition: color .15s; background: none; border: none; padding: 0;
}
.topbar-back:hover { color: var(--ink); }
.topbar-back svg { width: 16px; height: 16px; }
.topbar-title { font-size: 16px; font-weight: 700; }
.topbar-spacer { flex: 1; }
.btn-upload {
  background: var(--accent); color: #0a0a0a; font-weight: 700;
  border-radius: 9px; padding: 9px 18px; font-size: 14px; cursor: pointer; transition: opacity .15s;
}
.btn-upload:hover { opacity: .85; }
.btn-delete-sel {
  background: var(--danger); color: #fff; font-weight: 700;
  border-radius: 9px; padding: 9px 16px; font-size: 14px; cursor: pointer;
  transition: opacity .15s; display: none;
}
.btn-delete-sel:hover { opacity: .85; }
.main { padding: 32px 24px; flex: 1; }

/* ── VENDOR LIST ── */
#view-vendors { display: none; }
.vendor-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;
}
.vendor-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px 20px; cursor: pointer; transition: border-color .15s, background .15s;
  display: flex; flex-direction: column; gap: 10px;
}
.vendor-card:hover { border-color: var(--accent); background: var(--panel-2); }
.vc-name { font-weight: 700; font-size: 16px; }
.vc-count { font-size: 13px; color: var(--mute); }
.vc-date  { font-family: var(--mono); font-size: 12px; color: var(--mute); }
.empty-msg { color: var(--mute); font-size: 15px; padding: 40px 0; text-align: center; }

/* ── VENDOR DETAIL ── */
#view-detail { display: none; }
.quotes-table-wrap { overflow-x: auto; }
.quotes-table {
  width: 100%; border-collapse: collapse; font-size: 14px;
}
.quotes-table th {
  text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  color: var(--mute); padding: 10px 12px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.quotes-table td {
  padding: 14px 12px; border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.quotes-table tr:hover td { background: var(--panel); }
.td-check { width: 36px; }
.td-date  { white-space: nowrap; font-family: var(--mono); font-size: 13px; }
.td-title { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-price { text-align: right; font-family: var(--mono); white-space: nowrap; }
.td-price-sub { font-size: 11px; color: var(--mute); display: block; }
.td-file  { font-size: 12px; color: var(--mute); max-width: 180px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-pdf   { width: 80px; text-align: center; }
.td-memo  { min-width: 140px; max-width: 220px; }
.btn-pdf {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 10px; font-size: 12px; cursor: pointer; transition: all .15s; white-space: nowrap;
}
.btn-pdf:hover { border-color: var(--accent); color: var(--accent); }
.btn-pdf:disabled { opacity: .3; cursor: default; }
.cb { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.memo-cell {
  font-size: 13px; color: var(--mute); cursor: pointer;
  border-radius: 6px; padding: 4px 8px; transition: background .12s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
}
.memo-cell:hover { background: var(--panel-2); color: var(--ink); }
.memo-hint { color: rgba(246,244,239,.22); font-size: 12px; }
.memo-input {
  background: var(--panel-2); border: 1px solid var(--accent);
  border-radius: 6px; padding: 4px 8px; font-size: 13px; color: var(--ink);
  width: 100%; min-width: 120px; outline: none; font-family: var(--body);
}

/* ── UPLOAD MODAL ── */
#upload-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,.75);
  display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
}
#upload-modal.open { display: flex; }
.upload-box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 32px; width: min(520px, 100%); display: flex; flex-direction: column; gap: 18px;
}
.upload-box h2 { font-family: var(--display); font-size: 20px; }
.upload-box label {
  font-size: 12px; font-family: var(--mono); letter-spacing: .08em;
  color: var(--mute); display: block; margin-bottom: 6px;
}
.upload-box input[type=text], .upload-box select {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 10px 14px; font-size: 14px; width: 100%; outline: none;
  transition: border-color .15s; color: var(--ink);
}
.upload-box input[type=text]:focus { border-color: var(--accent); }
.vendor-combo { position: relative; }
.vendor-drop {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: 10px; overflow: hidden; z-index: 200; display: none;
  max-height: 200px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.vendor-drop.open { display: block; }
.vd-item { padding: 10px 14px; font-size: 14px; cursor: pointer; transition: background .1s; }
.vd-item:hover { background: var(--panel-2); }
.vd-new { color: var(--accent); border-top: 1px solid var(--line); }
.file-drop {
  background: var(--panel-2); border: 2px dashed var(--line);
  border-radius: 12px; padding: 28px; text-align: center;
  cursor: pointer; transition: border-color .15s; position: relative;
}
.file-drop:hover, .file-drop.drag { border-color: var(--accent); }
.file-drop input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.file-drop p { font-size: 14px; color: var(--mute); pointer-events: none; }
.file-drop strong { color: var(--accent); pointer-events: none; }
.file-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
.file-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel-2); border-radius: 8px; padding: 8px 12px; font-size: 13px;
}
.fi-name   { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fi-status { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.fi-wait   { color: var(--mute); }
.fi-ok     { color: var(--accent); }
.fi-skip   { color: var(--mute); }
.fi-err    { color: var(--danger); }
.fi-proc   { color: oklch(0.85 0.15 60); }
.rate-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--mute); font-family: var(--mono);
}
.rate-row input {
  width: 72px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 13px; color: var(--ink);
  outline: none; font-family: var(--mono); text-align: right;
}
.rate-row input:focus { border-color: var(--accent); }
.upload-progress { font-family: var(--mono); font-size: 12px; color: var(--mute); }
.upload-btn-row  { display: flex; gap: 10px; }
.btn-do-upload {
  flex: 1; background: var(--accent); color: #0a0a0a; font-weight: 700;
  border-radius: 9px; padding: 11px; font-size: 14px; cursor: pointer; transition: opacity .15s;
}
.btn-do-upload:hover:not(:disabled) { opacity: .85; }
.btn-do-upload:disabled { opacity: .4; cursor: default; }
.btn-cancel {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 11px 16px; font-size: 14px; cursor: pointer;
  color: var(--mute); transition: all .15s;
}
.btn-cancel:hover { color: var(--ink); }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-box">
    <h1>ONLYONE LED</h1>
    <p>견적서 관리 시스템</p>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn-login" onclick="doLogin()">로그인</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <!-- 상단 바 -->
  <div class="topbar">
    <button class="topbar-back" id="topbar-back" onclick="goVendorList()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      업체 목록
    </button>
    <div class="topbar-logo" id="topbar-logo">ONLYONE LED 견적서</div>
    <div class="topbar-title" id="topbar-vendor-name" style="display:none"></div>
    <div class="topbar-spacer"></div>
    <button class="btn-delete-sel" id="btn-delete-sel" onclick="deleteSelected()">선택 삭제</button>
    <button class="btn-upload" onclick="openUpload()">+ PDF 업로드</button>
  </div>

  <div class="main">
    <!-- 업체 목록 -->
    <div id="view-vendors">
      <div class="vendor-grid" id="vendor-grid"></div>
    </div>

    <!-- 견적서 목록 (업체별) -->
    <div id="view-detail">
      <div class="quotes-table-wrap">
        <table class="quotes-table">
          <thead>
            <tr>
              <th class="td-check"><input type="checkbox" class="cb" id="cb-all" onchange="toggleAll(this)" /></th>
              <th>날짜</th>
              <th>파일명</th>
              <th style="text-align:right">금액 (환산)</th>
              <th>메모</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="quotes-tbody"></tbody>
        </table>
      </div>
      <div class="empty-msg" id="detail-empty" style="display:none">등록된 견적서가 없습니다.</div>
    </div>
  </div>
</div>

<!-- ── UPLOAD MODAL ── -->
<div id="upload-modal" onclick="if(event.target===this)closeUpload()">
  <div class="upload-box">
    <h2>PDF 견적서 업로드</h2>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <label>업체명</label>
        <div class="vendor-combo">
          <input type="text" id="upload-vendor" placeholder="업체 검색 또는 입력" autocomplete="off"
            oninput="onVendorInput(this.value)"
            onfocus="onVendorInput(this.value)"
            onblur="setTimeout(closeVendorDrop, 150)" />
          <div class="vendor-drop" id="vendor-drop"></div>
        </div>
      </div>
      <div style="width:140px">
        <label>견적서 양식</label>
        <select id="upload-template" onchange="onTemplateChange()">
          <option value="jp">일본 견적서</option>
          <option value="kr">한국 견적서</option>
        </select>
      </div>
    </div>

    <div>
      <label>PDF 파일 (여러 개 선택 가능)</label>
      <div class="file-drop" id="file-drop">
        <input type="file" id="file-input" accept=".pdf" multiple onchange="onFilesSelected(this.files)" />
        <p>여기를 클릭하거나 PDF를 드래그해서 놓으세요<br><strong>여러 파일 동시 선택 가능</strong></p>
      </div>
    </div>

    <div class="file-list" id="file-list" style="display:none"></div>

    <div class="rate-row" id="rate-row" style="display:none">
      <span>¥1 =</span>
      <input type="number" id="jpy-rate" min="1" max="100" step="0.01" value="9.5"
        onchange="localStorage.setItem('jpy_rate', this.value)" />
      <span>원 (엔→원 환율)</span>
    </div>

    <div class="upload-progress" id="upload-progress"></div>

    <div class="upload-btn-row">
      <button class="btn-do-upload" id="btn-do-upload" onclick="runUpload()" disabled>업로드 시작</button>
      <button class="btn-cancel" onclick="closeUpload()">닫기</button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://onlyone-quote-worker.only1-d71.workers.dev';

let authToken     = '';
let currentVendor = '';
let allVendors    = [];

// ── LOGIN ──────────────────────────────────────────────
const PW_KEY = 'ql_token';

function doLogin() {
  const pw = document.getElementById('pw-input').value.trim();
  if (!pw) return;
  authToken = pw;
  localStorage.setItem(PW_KEY, pw);
  initApp();
}

async function initApp() {
  const res = await fetch(`${API_BASE}/api/vendors`, {
    headers: { 'X-Auth-Token': authToken }
  });
  if (res.status === 401) {
    localStorage.removeItem(PW_KEY);
    document.getElementById('login-err').textContent = '비밀번호가 틀렸습니다.';
    return;
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  route();
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(PW_KEY);
  if (saved) { authToken = saved; initApp(); }
});

// ── ROUTING ────────────────────────────────────────────
function route() {
  const vendor = new URLSearchParams(location.search).get('vendor');
  if (vendor) showVendorDetail(vendor);
  else        showVendorList();
}
window.addEventListener('popstate', route);

function goVendorList() {
  history.pushState({}, '', location.pathname);
  showVendorList();
}

function goVendorDetail(vendor) {
  history.pushState({}, '', `?vendor=${encodeURIComponent(vendor)}`);
  showVendorDetail(vendor);
}

// ── 업체 목록 ──────────────────────────────────────────
async function showVendorList() {
  currentVendor = '';
  document.getElementById('view-vendors').style.display = 'block';
  document.getElementById('view-detail').style.display  = 'none';
  document.getElementById('topbar-back').style.display  = 'none';
  document.getElementById('topbar-logo').style.display  = '';
  document.getElementById('topbar-vendor-name').style.display = 'none';
  document.getElementById('btn-delete-sel').style.display = 'none';

  const vendors = await apiFetch('/api/vendors');
  allVendors = (vendors || []).map(v => v.vendor);

  const grid = document.getElementById('vendor-grid');
  if (!vendors || !vendors.length) {
    grid.innerHTML = '<div class="empty-msg">등록된 업체가 없습니다.<br>PDF를 업로드하면 업체가 자동 생성됩니다.</div>';
    return;
  }

  grid.innerHTML = vendors.map(v => `
    <div class="vendor-card" onclick="goVendorDetail('${esc(v.vendor)}')">
      <div class="vc-name">${esc(v.vendor)}</div>
      <div class="vc-count">견적서 ${v.count}건</div>
      <div class="vc-date">${v.latest_date || '날짜 없음'}</div>
    </div>
  `).join('');
}

// ── 업체 상세 (견적서 목록) ────────────────────────────
async function showVendorDetail(vendor) {
  currentVendor = vendor;
  document.getElementById('view-vendors').style.display = 'none';
  document.getElementById('view-detail').style.display  = 'block';
  document.getElementById('topbar-back').style.display  = 'flex';
  document.getElementById('topbar-logo').style.display  = 'none';
  document.getElementById('topbar-vendor-name').textContent = vendor;
  document.getElementById('topbar-vendor-name').style.display = '';

  // 업로드 모달용 vendor 미리 설정
  document.getElementById('upload-vendor').value = vendor;

  await loadQuotes(vendor);
}

async function loadQuotes(vendor) {
  const data = await apiFetch(`/api/quotes?vendor=${encodeURIComponent(vendor)}`);
  const tbody = document.getElementById('quotes-tbody');
  const emptyEl = document.getElementById('detail-empty');
  document.getElementById('cb-all').checked = false;
  updateDeleteBtn();

  if (!data || !data.length) {
    tbody.innerHTML = '';
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';

  const rate = jpyRate();
  tbody.innerHTML = data.map(row => {
    const isJPY    = row.currency === 'JPY';
    const priceStr = row.total_price != null
      ? (isJPY ? `¥${Number(row.total_price).toLocaleString()}` : formatWon(row.total_price))
      : '—';
    const krwStr   = (isJPY && row.total_price != null)
      ? `≈ ${formatWon(Math.round(row.total_price * rate))}`
      : '';
    const memoVal  = row.memo || '';

    return `
      <tr>
        <td class="td-check">
          <input type="checkbox" class="cb row-cb" data-id="${row.id}" onchange="updateDeleteBtn()" />
        </td>
        <td class="td-date">${row.date || '—'}</td>
        <td class="td-title">${esc(row.drive_file_name || '—')}</td>
        <td class="td-price">
          ${priceStr}
          ${krwStr ? `<span class="td-price-sub">${krwStr}</span>` : ''}
        </td>
        <td class="td-memo">
          <span class="memo-cell" data-id="${row.id}" data-memo="${esc(memoVal)}" onclick="startMemoEdit(this)">${memoVal ? esc(memoVal) : '<span class="memo-hint">+ 메모</span>'}</span>
        </td>
        <td class="td-pdf">
          <button class="btn-pdf" onclick="openPDF(${row.id})">PDF 열기</button>
        </td>
      </tr>`;
  }).join('');
}

function openPDF(id) {
  window.open(`${API_BASE}/api/pdf/${id}?token=${encodeURIComponent(authToken)}`, '_blank');
}

// ── 체크박스 / 삭제 ────────────────────────────────────
function toggleAll(cb) {
  document.querySelectorAll('.row-cb').forEach(el => el.checked = cb.checked);
  updateDeleteBtn();
}

function updateDeleteBtn() {
  const count = document.querySelectorAll('.row-cb:checked').length;
  const btn   = document.getElementById('btn-delete-sel');
  btn.style.display   = count > 0 ? 'block' : 'none';
  btn.textContent     = count > 0 ? `선택 삭제 (${count}건)` : '';
}

async function deleteSelected() {
  const ids = [...document.querySelectorAll('.row-cb:checked')].map(el => parseInt(el.dataset.id));
  if (!ids.length) return;
  if (!confirm(`${ids.length}건을 삭제합니다. 복구할 수 없습니다.`)) return;

  const res = await fetch(`${API_BASE}/api/quotes`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json', 'X-Auth-Token': authToken },
    body: JSON.stringify({ ids }),
  });
  if (res.ok) {
    await loadQuotes(currentVendor);
    // 업체 목록 갱신 (삭제 후 업체가 사라질 수 있음)
  }
}

// ── 환율 ───────────────────────────────────────────────
function jpyRate() { return parseFloat(localStorage.getItem('jpy_rate') || '9.5'); }
function formatWon(n) { return '₩' + Math.round(n).toLocaleString(); }

// ── 업체명 드롭다운 ────────────────────────────────────
function onVendorInput(val) {
  const drop = document.getElementById('vendor-drop');
  const q    = val.trim().toLowerCase();
  const filtered = q ? allVendors.filter(v => v.toLowerCase().includes(q)) : allVendors;
  const exact    = allVendors.some(v => v.toLowerCase() === q);

  drop.innerHTML = [
    ...filtered.map(v => `<div class="vd-item" onmousedown="pickVendor('${esc(v)}')">${esc(v)}</div>`),
    (!exact && val.trim()) ? `<div class="vd-item vd-new" onmousedown="pickVendor('${esc(val.trim())}')">+ "${esc(val.trim())}" 새 업체로 추가</div>` : '',
  ].join('');

  drop.classList.toggle('open', !!(filtered.length || (!exact && val.trim())));
}

function pickVendor(name) {
  document.getElementById('upload-vendor').value = name;
  document.getElementById('vendor-drop').classList.remove('open');
}
function closeVendorDrop() {
  document.getElementById('vendor-drop').classList.remove('open');
}

function onTemplateChange() {
  const isJP = document.getElementById('upload-template').value === 'jp';
  document.getElementById('rate-row').style.display = isJP ? 'flex' : 'none';
}

// ── UPLOAD ─────────────────────────────────────────────
let selectedFiles = [];

function openUpload() {
  selectedFiles = [];
  document.getElementById('file-input').value = '';
  document.getElementById('file-list').style.display = 'none';
  document.getElementById('file-list').innerHTML = '';
  document.getElementById('upload-progress').textContent = '';
  document.getElementById('btn-do-upload').disabled = true;
  document.getElementById('btn-do-upload').textContent = '업로드 시작';
  document.getElementById('jpy-rate').value = jpyRate();
  if (currentVendor) document.getElementById('upload-vendor').value = currentVendor;
  onTemplateChange(); // 선택된 템플릿에 맞춰 환율 행 표시
  document.getElementById('upload-modal').classList.add('open');

  // 업체 목록 로드
  apiFetch('/api/vendors').then(vendors => {
    allVendors = (vendors || []).map(v => v.vendor);
  });

  // 드래그앤드롭
  const drop = document.getElementById('file-drop');
  drop.ondragover  = e => { e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = () => drop.classList.remove('drag');
  drop.ondrop      = e => { e.preventDefault(); drop.classList.remove('drag'); onFilesSelected(e.dataTransfer.files); };
}

function closeUpload() {
  document.getElementById('upload-modal').classList.remove('open');
}

function onFilesSelected(files) {
  selectedFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
  const listEl  = document.getElementById('file-list');
  listEl.innerHTML = '';
  if (!selectedFiles.length) { listEl.style.display = 'none'; return; }
  listEl.style.display = 'flex';
  selectedFiles.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    div.innerHTML = `<span class="fi-name">${esc(f.name)}</span><span class="fi-status fi-wait" id="fi-s-${i}">대기</span>`;
    listEl.appendChild(div);
  });
  document.getElementById('btn-do-upload').disabled = false;
}

async function runUpload() {
  const vendor   = document.getElementById('upload-vendor').value.trim();
  const template = document.getElementById('upload-template').value;
  if (!vendor)             { alert('업체명을 입력해주세요.'); return; }
  if (!selectedFiles.length) return;

  const btn  = document.getElementById('btn-do-upload');
  const prog = document.getElementById('upload-progress');
  btn.disabled = true;

  let ok = 0, skipped = 0, errors = 0;
  const currency = template === 'jp' ? 'JPY' : 'KRW';

  for (let i = 0; i < selectedFiles.length; i++) {
    const file     = selectedFiles[i];
    const statusEl = document.getElementById(`fi-s-${i}`);
    statusEl.textContent = '파싱 중…'; statusEl.className = 'fi-status fi-proc';
    prog.textContent = `${i + 1} / ${selectedFiles.length} 처리 중…`;

    try {
      // 1. PDF.js로 파싱
      const parsed = await parsePDF(file, template);

      // 2. multipart로 Worker에 전송 (PDF 원본 + 파싱 결과)
      const fd = new FormData();
      fd.append('vendor',      vendor);
      fd.append('currency',    currency);
      fd.append('parsed_data', JSON.stringify(parsed));
      fd.append('pdf',         file);

      const res  = await fetch(`${API_BASE}/api/upload`, {
        method: 'POST',
        headers: { 'X-Auth-Token': authToken },
        body: fd,
      });
      const data = await res.json();

      if (data.skipped) {
        statusEl.textContent = '이미 처리됨'; statusEl.className = 'fi-status fi-skip'; skipped++;
      } else if (data.ok) {
        statusEl.textContent = '완료'; statusEl.className = 'fi-status fi-ok'; ok++;
      } else {
        statusEl.textContent = data.error || '오류'; statusEl.className = 'fi-status fi-err'; errors++;
      }
    } catch (err) {
      statusEl.textContent = err.message || '오류'; statusEl.className = 'fi-status fi-err'; errors++;
    }
  }

  prog.textContent = `완료: ${ok}건 추가 / ${skipped}건 스킵 / ${errors}건 오류`;
  btn.disabled = false; btn.textContent = '다시 업로드';

  if (ok > 0) {
    if (currentVendor) await loadQuotes(currentVendor);
    else await showVendorList();
  }
}

// ── API ────────────────────────────────────────────────
async function apiFetch(path) {
  try {
    const res = await fetch(`${API_BASE}${path}`, { headers: { 'X-Auth-Token': authToken } });
    if (res.status === 401) {
      localStorage.removeItem(PW_KEY);
      location.reload();
      return null;
    }
    return await res.json();
  } catch { return null; }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 메모 인라인 편집 ───────────────────────────────────
function startMemoEdit(cell) {
  const id          = parseInt(cell.dataset.id);
  const currentMemo = cell.dataset.memo || '';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'memo-input';
  input.value = currentMemo;
  input.maxLength = 200;
  input.placeholder = '메모 입력 후 Enter';
  cell.replaceWith(input);
  input.focus();

  function renderCell(memo) {
    const span = document.createElement('span');
    span.className = 'memo-cell';
    span.dataset.id   = id;
    span.dataset.memo = memo;
    span.innerHTML = memo ? esc(memo) : '<span class="memo-hint">+ 메모</span>';
    span.onclick = () => startMemoEdit(span);
    input.replaceWith(span);
  }

  let saved = false;
  async function save() {
    if (saved) return;
    saved = true;
    const newMemo = input.value.trim();
    renderCell(newMemo);
    await fetch(`${API_BASE}/api/quotes/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': authToken },
      body: JSON.stringify({ memo: newMemo }),
    });
  }

  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { saved = true; renderCell(currentMemo); }
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeUpload(); });

// ── PDF.js ─────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function parsePDF(file, templateId) {
  const ab   = await file.arrayBuffer();
  const pdf  = await pdfjsLib.getDocument({ data: ab }).promise;
  const page = await pdf.getPage(1);
  const tc   = await page.getTextContent();

  const raw = tc.items
    .filter(it => it.str.trim())
    .map(it => ({ str: it.str.trim(), x: Math.round(it.transform[4]), y: Math.round(it.transform[5]) }));

  raw.sort((a, b) => b.y - a.y || a.x - b.x);

  const rows = [];
  for (const item of raw) {
    const last = rows[rows.length - 1];
    if (last && Math.abs(item.y - last[0].y) <= 4) last.push(item);
    else rows.push([item]);
  }
  const lines    = rows.map(r => r.map(i => i.str).join(' '));
  const fullText = lines.join('\n');

  if (templateId === 'jp') return parseTemplateJP(lines, fullText);
  if (templateId === 'kr') return parseTemplateKR(lines, fullText);
  throw new Error('알 수 없는 템플릿');
}

function matchAfter(text, re) {
  const m = text.match(re);
  return m ? (m[1] || m[0]).trim() : null;
}

function parseAmount(str) {
  if (!str) return null;
  const m = str.replace(/,/g, '').match(/\d+/);
  return m ? parseInt(m[0]) : null;
}

// ── JP 파서 ────────────────────────────────────────────
function parseTemplateJP(lines, fullText) {
  const title   = matchAfter(fullText, /Subject[：:]\s*(.+)/);
  const quoteNo = matchAfter(fullText, /Quote No[.．：:.]\s*([^\n\s]+)/);
  const date    = matchAfter(fullText, /Issue Date[：:]\s*(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})/);
  const attnLn  = lines.find(l => /御中/.test(l));
  const attn    = attnLn ? attnLn.replace(/御中.*/, '').trim() : null;
  const totalLn = lines.find(l => /合\s*計.*Total/.test(l));
  const total   = totalLn ? parseAmount(totalLn.replace(/[^¥\d,]/g, '')) : null;
  const remIdx  = lines.findIndex(l => /備考.*Remarks/.test(l));
  const remarks = remIdx >= 0 ? lines.slice(remIdx + 1).find(l => l.trim()) || null : null;

  const content = [
    attn    ? `수신: ${attn}`         : null,
    quoteNo ? `견적번호: ${quoteNo}` : null,
    remarks ? `비고: ${remarks}`      : null,
  ].filter(Boolean).join('\n') || null;

  return {
    title: title || (quoteNo ? `견적서 #${quoteNo}` : null),
    date:  date ? date.replace(/\//g, '-') : null,
    items: extractItemsJP(lines),
    content,
    total_price: total,
  };
}

function extractItemsJP(lines) {
  const headerIdx = lines.findIndex(l => /商品名.*Item/.test(l));
  const endIdx    = lines.findIndex((l, i) => i > headerIdx && /小\s*計|Subtotal/.test(l));
  if (headerIdx < 0) return [];
  const tableEnd = endIdx > 0 ? endIdx : lines.length;

  const items = [];
  let pendingName = '';

  for (let i = headerIdx + 1; i < tableEnd; i++) {
    const line = lines[i];
    if (!line || /^ページ|^Page/.test(line)) continue;

    const nums = [...line.matchAll(/([\d]{1,3}(?:,[\d]{3})*(?:\.[\d]+)?)/g)]
      .map(m => parseFloat(m[0].replace(/,/g, ''))).filter(n => !isNaN(n));

    if (nums.length === 0) {
      pendingName += (pendingName ? ' ' : '') + line.replace(/\s+/g, ' ');
      continue;
    }

    const namePart = line
      .replace(/([\d]{1,3}(?:,[\d]{3})*(?:\.[\d]+)?)/g, '')
      .replace(/[¥￥]/g, '')
      .replace(/平米|㎡|台|式|別途|TBD|Unit|Set|\//g, '')
      .replace(/\s+/g, ' ').trim();

    const name = (pendingName + ' ' + namePart).trim();
    pendingName = '';

    const isTBD = /別途|TBD/.test(line);
    if (isTBD) { items.push({ name, quantity: nums[1] || 1, unit_price: 0, amount: 0 }); continue; }

    if (nums.length >= 3) {
      items.push({
        name,
        quantity:   nums.length >= 4 ? nums[nums.length - 3] : nums[0],
        unit_price: nums[nums.length - 2],
        amount:     nums[nums.length - 1],
      });
    } else if (nums.length === 2) {
      items.push({ name, quantity: null, unit_price: nums[0], amount: nums[1] });
    }
  }
  return items;
}

// ── KR 파서 (샘플 확인 후 완성 예정) ──────────────────
function parseTemplateKR(lines, fullText) {
  const title = matchAfter(fullText, /건\s*명\s*[：:]\s*(.+)/) ||
                matchAfter(fullText, /품\s*명\s*[：:]\s*(.+)/);
  const date  = matchAfter(fullText, /견적일\s*[：:]?\s*(\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2})/) ||
                matchAfter(fullText, /작성일\s*[：:]?\s*(\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2})/);
  const totalLn = lines.find(l => /합\s*계|총\s*액/i.test(l));
  const total   = totalLn ? parseAmount(totalLn) : null;

  return { title: title || null, date: date ? date.replace(/[.\/]/g, '-') : null,
           items: [], content: null, total_price: total };
}
