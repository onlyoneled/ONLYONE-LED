<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONLYONE LED Planner — LED 전광판 플래너</title>
<meta name="description" content="LED 캐비닛 배치, 해상도, 곡면, 결선, 콘텐츠 캔버스와 Resolume Arena 출력까지 한 번에 설계하는 온리원 LED 플래너.">
<link rel="canonical" href="https://only1led.com/planner/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="planner.css">
<script>
  // 첫 화면 깜빡임 방지: 저장된 테마를 먼저 적용
  try {
    var pr = JSON.parse(localStorage.getItem('o1p.prefs') || '{}');
    var th = pr.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', th);
  } catch (e) {}
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="/" title="only1led.com">
    <span class="logo">ONLYONE <b>LED</b></span>
    <span class="sub" data-i18n="appSub">LED 전광판 플래너</span>
  </a>
  <div class="seg" role="group" id="modeSeg">
    <button type="button" data-act="mode" data-v="simple" data-i18n="simple">심플</button>
    <button type="button" data-act="mode" data-v="pro" data-i18n="pro">프로</button>
  </div>
  <div class="top-right">
    <span class="saved" id="savedNote"></span>
    <button type="button" class="icon-btn" data-act="theme" data-i18n-title="theme" aria-label="theme">◐</button>
    <div class="seg small" role="group" id="langSeg">
      <button type="button" data-act="lang" data-v="ko">KO</button>
      <button type="button" data-act="lang" data-v="en">EN</button>
    </div>
  </div>
</header>

<div class="projbar">
  <label class="pf"><span data-i18n="project">프로젝트</span><input type="text" data-bind="p.name" data-kind="str" id="pName"></label>
  <label class="pf"><span data-i18n="client">고객사</span><input type="text" data-bind="p.client" data-kind="str"></label>
  <label class="pf rev"><span data-i18n="revision">리비전</span><input type="text" data-bind="p.rev" data-kind="str"></label>
  <div class="pbtns">
    <button type="button" class="btn" data-act="newProject" data-i18n="newProject">새 프로젝트</button>
    <button type="button" class="btn" data-act="openSaved" data-i18n="openSaved">저장본 열기</button>
    <button type="button" class="btn" data-act="duplicate" data-i18n="duplicate">복제</button>
    <button type="button" class="btn" data-act="importJson" data-i18n="importJson">가져오기</button>
    <button type="button" class="btn" data-act="exportJson" data-i18n="exportJson">JSON</button>
    <button type="button" class="btn primary" data-act="exportReport" data-i18n="exportReport">PDF / PNG 내보내기</button>
  </div>
</div>

<nav class="tabs" id="proTabs" hidden>
  <button type="button" data-act="tab" data-v="design"><b>1</b> <span data-i18n="tabDesign">디자인</span></button>
  <button type="button" data-act="tab" data-v="cabling"><b>2</b> <span data-i18n="tabCabling">결선</span></button>
  <button type="button" data-act="tab" data-v="canvas"><b>3</b> <span data-i18n="tabCanvas">캔버스 · Arena</span></button>
  <button type="button" data-act="tab" data-v="catalog"><b>4</b> <span data-i18n="tabCatalog">카탈로그</span></button>
</nav>

<main id="main"></main>

<!-- 3D 뷰는 다시 그릴 때마다 새로 만들지 않도록 여기 보관했다가 자리로 옮긴다 -->
<div id="v3dStore" hidden><div id="v3dHost" class="v3d-host"></div></div>

<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
