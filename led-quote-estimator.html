<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED 견적 예상 계산기</title>
<style>
:root{
  --primary:#1a56db;--primary-dark:#1e40af;--bg:#f1f5f9;--card:#fff;
  --border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --green:#16a34a;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);}
.hdr{background:linear-gradient(135deg,#1a56db,#7c3aed);color:#fff;padding:18px 32px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(26,86,219,.3);}
.hdr h1{font-size:20px;font-weight:700;}
.hdr p{font-size:12px;opacity:.8;margin-top:2px;}
.wrap{max-width:1300px;margin:0 auto;padding:24px 20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:20px;}
.card h2{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#e0e7ff;color:#3730a3;font-weight:600;}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid var(--border);}
.frow{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.frow label{font-size:12px;font-weight:600;color:var(--muted);}
.frow input,.frow select{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:500;color:var(--text);transition:border .2s;background:#fff;}
.frow input:focus,.frow select:focus{outline:none;border-color:var(--primary);}
.frow input[readonly]{background:#f8fafc;color:var(--muted);}
.frow .hint{font-size:11px;color:var(--muted);}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;}
.radio-group label{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;font-weight:500;line-height:1.4;}
.radio-group label.checked{background:var(--primary);color:#fff;border-color:var(--primary);}
.radio-group input{display:none;}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.res-card{border-radius:12px;padding:14px;text-align:center;}
.res-card .lbl{font-size:11px;font-weight:700;opacity:.8;margin-bottom:5px;}
.res-card .val{font-size:18px;font-weight:800;}
.res-card.blue{background:#dbeafe;color:#1d4ed8;}
.res-card.green{background:#dcfce7;color:#15803d;}
.res-card.orange{background:#ffedd5;color:#c2410c;}
.res-card.purple{background:#ede9fe;color:#7c3aed;}
.res-card.red{background:#fee2e2;color:#b91c1c;}
.res-card.gray{background:#f1f5f9;color:#475569;}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:#f8fafc;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:last-child{border:none;}
tbody tr:hover{background:#f8fafc;}
tbody td{padding:9px 12px;vertical-align:middle;}
tbody tr.total-row{background:#1a56db;color:#fff;font-weight:700;}
tbody tr.total-row td{padding:11px 12px;}
tbody tr.spare-row{background:#fefce8;}
.sep-row td{background:#f1f5f9;font-size:11px;font-weight:700;color:var(--muted);padding:5px 12px;}
.tr{text-align:right;}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{padding:9px 18px;border-radius:10px;border:none;background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s;}
.tab-btn.active{background:var(--primary);color:#fff;}
.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:12px;color:#1d4ed8;margin-bottom:14px;}
.price-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.sale-total-box{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:linear-gradient(135deg,#1a56db,#7c3aed);border-radius:12px;padding:18px 16px;margin-top:16px;color:#fff;}
.sale-total-box .st-item{text-align:center;}
.sale-total-box .st-lbl{font-size:11px;opacity:.75;margin-bottom:6px;font-weight:600;}
.sale-total-box .st-val{font-size:20px;font-weight:800;line-height:1.2;}
.sticky-top{position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.10);}
.rate-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 32px;display:flex;align-items:center;gap:14px;font-size:13px;flex-wrap:wrap;}
.rate-bar .lbl{color:var(--muted);font-weight:600;}
.rate-bar .rate-val{font-size:16px;font-weight:800;color:var(--primary);}
.rate-bar .rate-time{font-size:11px;color:var(--muted);}
.rate-badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.rate-badge.live{background:#dcfce7;color:#15803d;}
.rate-badge.err{background:#fee2e2;color:#b91c1c;}
.rate-badge.loading{background:#f1f5f9;color:#64748b;}
.rate-btn{padding:5px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s;margin-left:auto;}
.rate-btn:hover{border-color:var(--primary);color:var(--primary);}
</style>
</head>
<body>

<div class="sticky-top">
<div class="hdr">
  <div style="font-size:26px;">📐</div>
  <div>
    <h1>LED 견적 예상 계산기</h1>
    <p>실제 견적서 269건 분석 기반 — 화면 사이즈 입력 시 자동 산출</p>
  </div>
</div>
</div>

<div class="wrap">

<div class="notice">
  ⚠️ 이 계산기는 <b>과거 견적서에서 관측된 단가</b>를 근거로 한 예상치입니다.
  실제 발주가는 업체 협상·시장 변동에 따라 달라질 수 있습니다.
</div>

<div class="card">
  <h2>📏 화면 사이즈</h2>
  <div class="grid2">
    <div class="frow"><label>가로 (mm)</label><input type="number" id="inp-w" value="2000" min="320" step="10"></div>
    <div class="frow"><label>세로 (mm)</label><input type="number" id="inp-h" value="1500" min="160" step="10"></div>
  </div>
</div>

<div class="card">
  <h2>🔲 LED 모듈</h2>
  <div class="tabs">
    <button class="tab-btn active" id="tab-smd">SMD</button>
    <button class="tab-btn" id="tab-gobcob">GOB/COB (타업체 참고 데이터)</button>
  </div>
  <div class="frow">
    <label>피치</label>
    <select id="sel-pitch"></select>
  </div>
</div>

<div class="card">
  <h2>🎛️ 부품 선택</h2>
  <div class="grid3">
    <div class="frow"><label>수신카드</label><select id="sel-rcv"></select></div>
    <div class="frow"><label>SMPS</label><select id="sel-smps"></select></div>
    <div class="frow"><label>프로세서</label><select id="sel-proc"></select></div>
  </div>
</div>

<div class="card">
  <h2>📊 예상 원가</h2>
  <div class="res-grid" id="res-summary"></div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>항목</th><th>수량</th><th class="tr">단가(CNY)</th><th class="tr">소계(CNY)</th><th>비고</th></tr></thead>
      <tbody id="tbody-items"></tbody>
    </table>
  </div>
  <div id="warnings-box"></div>
</div>

</div><!-- /wrap -->

<script src="data/led-cost-data.js"></script>
<script src="admin-tools/led-quote-estimator-calc.js"></script>
<script>
// Task 5에서 채움
</script>

</body>
</html>
